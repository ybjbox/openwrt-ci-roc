name: IPQ60XX-Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt-Diagnose.yml
    secrets: inherit
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/openwrt-6.x.git
      repo_branch: 25.12-nss
      config_file: configs/IPQ60XX.config
      firmware_tag: IPQ60XX-DIAG
      kernel_file: kernel-6.12
      artifact_prefix: IPQ60XX-DIAG
      manifest_file: libwrt-qualcommax-ipq60xx.manifest
      release_summary: "诊断专用构建：定位 make defconfig 的 kconfig 双引号错误。不会发布 Release。"
      remove_sqm_scripts_nss: false
      rename_qualcommax_to_nowifi: false
      delete_old_workflows: false
      package_extension: apk
